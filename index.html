<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Log">
<meta name="theme-color" content="#f3f4f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
<title>Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, sticky top summary, fixed bottom tab bar. Day colours follow Olympic plate colours. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface-2:#eceeeb; --ink:#16191d; --muted:#5f6670; --line:#dcdfdc;
  --accent:#1f4fd1; --on-accent:#ffffff;
  --red:#c9312b; --blue:#1f4fd1; --yellow:#c99700; --green:#1d8a4c; --grey:#6b7280;
  --done-bg:#e3f2e9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111315; --surface:#1a1d21; --surface-2:#22262b; --ink:#eceef0; --muted:#9aa1aa; --line:#2d3238;
    --accent:#7196ff; --on-accent:#0d1117;
    --red:#ef5b52; --blue:#7196ff; --yellow:#f0c040; --green:#45c47a; --grey:#9aa1aa;
    --done-bg:#183324;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}

/* top */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px;border-bottom:1px solid var(--line)}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top h1{font-size:28px;line-height:1}
.top .date{color:var(--muted);font-size:13px}
.week{display:flex;gap:6px;margin-top:10px}
.wd{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wd .dots{height:8px;display:flex;justify-content:center;gap:3px;margin-top:4px}
.wd .dot{width:8px;height:8px;border-radius:50%}
.wd.today{color:var(--ink);font-weight:600}

main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip .sw{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.c-red{background:var(--red)}.c-blue{background:var(--blue)}.c-yellow{background:var(--yellow)}.c-green{background:var(--green)}.c-grey{background:var(--grey)}.c-black{background:var(--ink)}.c-accent{background:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.session-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.session-head h2{font-size:26px}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* exercise card */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px}
.ex.complete{background:var(--done-bg)}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ex-head h3{font-size:20px;line-height:1.1;min-width:0}
.ex-tools{display:flex;gap:6px;align-items:center;flex:none}
.rm{background:none;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.rm[data-armed]{color:var(--red);border-color:var(--red)}
.check{display:flex;align-items:center;gap:8px}
.check input{width:18px;height:18px}
.tag{flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.hint{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.hint .up{color:var(--green);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 44px;gap:8px;align-items:center}
.sn{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.field{display:flex;align-items:center;background:var(--surface-2);border-radius:10px;padding:0 10px;min-width:0}
.field input{width:100%;min-width:0;border:0;background:transparent;padding:10px 0;font-size:17px;font-variant-numeric:tabular-nums;outline:none}
.field span{font-size:12px;color:var(--muted)}
.field:focus-within{outline:2px solid var(--accent)}
.tick{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:20px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}

/* buttons */
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;background:var(--accent);color:var(--on-accent);width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
.btn.small{width:auto;padding:8px 12px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600}

input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=date],input[type=text],input[type=number],select,textarea{background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px}

/* run */
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.phase{border-radius:10px;padding:10px;background:var(--surface-2);text-align:center}
.phase .mins{font-family:var(--display);font-size:26px;line-height:1}
.phase .kmh{font-size:12px;color:var(--muted)}
.phase.run{background:var(--green);color:#fff}
.phase.run .kmh{color:rgba(255,255,255,.85)}
.clock{text-align:center;padding-block:8px}
.clock .ph{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.06em}
.clock .t{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:3px;height:8px;margin-top:10px}
.bar div{background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0}

/* history */
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{list-style:none;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary .sw{width:10px;height:10px;border-radius:50%;flex:none}
summary .s-main{flex:1;min-width:0}
summary .s-title{font-weight:600}
.d-body{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.d-line{display:flex;justify-content:space-between;gap:10px}
.d-line span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.prog{display:flex;flex-direction:column}
.prog .p{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.prog .p:last-child{border-bottom:0}
.prog .p b{font-variant-numeric:tabular-nums;font-weight:600}
.delta-up{color:var(--green)}
.weeks{display:flex;gap:8px;align-items:flex-end;height:70px}
.weeks .w{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.weeks .w i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}

/* setup */
.ex-edit{display:grid;grid-template-columns:1fr 56px 1fr 44px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex-edit .nm{grid-column:1/-1}
.ex-edit .opts{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.ex-edit .opts select{width:auto}
.ex-edit .opts label{display:flex;align-items:center;gap:6px}
.mini{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.plan-row{display:grid;grid-template-columns:1fr 80px 40px;gap:6px;align-items:end}
.x{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:42px;color:var(--muted)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:flex}
nav button{flex:1;background:none;border:0;padding:12px 0 10px;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:10}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
@media (prefers-reduced-motion: no-preference){.tick,.chip{transition:background .15s,color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="top"></div></header>
<main><div class="wrap" id="view"></div></main>
<nav><div class="wrap">
  <button data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Train</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>History</button>
  <button data-tab="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 10a5 5 0 0 1 7 0M12 10l1.5-2"/></svg>Body</button>
  <button data-tab="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Setup</button>
</div></nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
const KEY = "traininglog.v1";
const uid = () => Math.random().toString(36).slice(2,10);
// name, sets, rep target, options. A blank start weight means "set it in your first session".
const ex = (name, sets = 3, reps = "8-12", o = {}) => ({id: uid(), name, start: o.start ?? null, inc: o.inc ?? 2.5, side: o.side || "", assisted: !!o.assisted, sets, reps});
const RUN_KINDS = {steady: "Steady run", intervals: "Intervals", hills: "Hill sprints", easy: "Easy run"};

/* The 28-week plan: four lifting days. Names that match the old log keep their history. */
const PLAN_ORDER = ["push", "pull", "legs", "upper"];
function planTemplates(){
  return {
    push: {name: "Push", color: "red", exercises: [
      ex("Incline dumbbell press", 3, "6-10"),
      ex("Chest press", 3, "8-12"),
      ex("Seated dumbbell shoulder press", 3, "8-10"),
      ex("Single cable lateral raises", 3, "12-15", {side: "each", inc: 1}),
      ex("Tricep cable push down", 3, "10-12"),
      ex("Overhead cable tricep extension", 2, "12-15")
    ]},
    pull: {name: "Pull", color: "blue", exercises: [
      ex("Lat pull down", 3, "6-10"),
      ex("Chest-supported dumbbell row", 3, "8-10"),
      ex("Low row", 3, "10-12"),
      ex("Face pull", 3, "12-15"),
      ex("Incline dumbbell curl", 3, "8-12"),
      ex("Hammer curls", 2, "10-12")
    ]},
    legs: {name: "Legs & core", color: "yellow", exercises: [
      ex("Goblet squats", 3, "8-10"),
      ex("Dumbbell Romanian deadlift", 3, "8-10"),
      ex("Walking lunge", 2, "10/leg"),
      ex("Leg curl", 2, "10-12"),
      ex("Hanging knee raise", 3, "10-15"),
      ex("Cable crunch", 3, "12-15")
    ]},
    upper: {name: "Upper", color: "black", exercises: [
      ex("Flat dumbbell press", 3, "8-10"),
      ex("Chin assist", 3, "8-10", {assisted: true}),
      ex("Single cable lateral raises", 3, "15-20", {side: "each", inc: 1}),
      ex("Rear delt fly", 2, "15"),
      ex("Cable fly", 2, "12-15"),
      ex("Bicep curls with rope cable", 3, "12", {inc: 1}),
      ex("Tricep cable push down", 3, "12"),
      ex("Ab wheel", 3, "8-10")
    ]}
  };
}

function defaults(){
  return {version: 2, templates: planTemplates(), order: [...PLAN_ORDER], sessions: [], checkins: [], drafts: {}};
}

// v1 had Chest & Tri / Back & Bi / Legs. Stamp old sessions with their day name so history still reads right,
// carry starting weights across for exercises that kept their name, then switch to the plan's four days.
function migrate(){
  if (!S.drafts) S.drafts = {};
  if (!Array.isArray(S.checkins)) S.checkins = [];
  if ((S.version || 1) >= 2) return;
  S.sessions.forEach(s => { if (s.type === "lift" && !s.label){ const t = S.templates?.[s.day]; if (t){ s.label = t.name; s.color = t.color; } } });
  const old = {};
  for (const k in (S.templates || {})) S.templates[k].exercises.forEach(x => { old[norm(x.name)] = x; });
  const fresh = planTemplates();
  for (const k in fresh) fresh[k].exercises.forEach(x => { const o = old[norm(x.name)]; if (o){ x.start = o.start; x.inc = o.inc; } });
  S.templates = fresh;
  S.order = [...PLAN_ORDER];
  S.drafts = {};
  if (S.lastMode && !S.templates[S.lastMode] && S.lastMode !== "run" && S.lastMode !== "class") delete S.lastMode;
  S.version = 2;
  save(true);
}

let S;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : defaults(); }
  catch(e){ S = defaults(); }
  migrate();
}
let saveT;
function save(now){
  clearTimeout(saveT);
  const go = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast("Couldn't save. Storage may be full or blocked."); } };
  if (now) go(); else saveT = setTimeout(go, 300);
}

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const kg = n => { const v = Math.round(Number(n) * 100) / 100; return isFinite(v) ? String(v) : ""; };
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => parse(s).toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"});
function weekStart(d){ const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; }
const typeColor = s => s.type === "run" ? "green" : s.type === "class" ? "grey" : (s.color || S.templates[s.day]?.color || "grey");
const typeName = s => s.type === "run" ? (RUN_KINDS[s.kind] || "Treadmill run") : s.type === "class" ? (s.name || "Class") : (s.label || S.templates[s.day]?.name || "Lifting");
const repTop = r => { const m = String(r || "").match(/(\d+)(?!.*\d)/); return m ? m[1] : ""; };
const num = v => { const n = Number(String(v).replace(",", ".")); return v === "" || v == null || !isFinite(n) ? null : n; };
const sideLabel = v => v === "each" ? "Each side" : v === "per" ? "Per side" : "";
const norm = s => String(s).trim().toLowerCase();

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

function sortedSessions(){ return [...S.sessions].sort((a, b) => (b.date + (b.at || "")).localeCompare(a.date + (a.at || ""))); }

function lastFor(name){
  const n = norm(name);
  for (const s of sortedSessions()){
    if (s.type !== "lift") continue;
    const e = s.entries.find(e => norm(e.name) === n);
    if (e && e.sets.length) return {entry: e, date: s.date};
  }
  return null;
}

function suggest(x){
  const last = lastFor(x.name);
  if (!last) return x.start == null ? {w: "", text: "First time. Set your working weight."} : {w: x.start, text: "Starting weight."};
  const sets = last.entry.sets;
  const top = Math.max(...sets.map(s => Number(s.w) || 0));
  const reps = sets.map(s => s.r || 0);
  return {w: top, text: `Last time <b>${kg(top)}kg</b> · ${reps.join("/")}.`};
}

function entryFor(x, extra){
  const sg = suggest(x);
  const w = sg.w === "" || sg.w == null ? "" : kg(sg.w);
  const n = Math.max(1, Math.min(6, Number(x.sets) || 3));
  return Object.assign({exId: x.id || null, name: x.name, reps: x.reps || "", sets: Array.from({length: n}, () => ({w, r: "", done: false}))}, extra || {});
}
function exFor(t, e){
  return t.exercises.find(x => x.id === e.exId) || {name: e.name, side: e.side || "", inc: e.inc || 2.5, start: e.start ?? null, reps: e.reps || "", assisted: false, tempOnly: true};
}

function getDraft(day){
  const old = S.drafts[day];
  // A draft from an earlier day with nothing ticked and no date picked by hand is stale: start fresh for today.
  if (old && old.date !== today() && !old.dateSet && !old.entries.some(e => e.sets.some(s => s.done))) delete S.drafts[day];
  if (!S.drafts[day]){
    S.drafts[day] = {date: today(), entries: S.templates[day].exercises.map(x => entryFor(x))};
    save();
  }
  return S.drafts[day];
}

/* ---------- UI state ---------- */
const UI = {tab: "train", mode: null};

/* ---------- render: top ---------- */
function renderTop(){
  const now = new Date();
  const ws = weekStart(now);
  const days = [];
  for (let i = 0; i < 7; i++){ const d = new Date(ws); d.setDate(ws.getDate() + i); days.push(d); }
  const t = today();
  const weekCount = S.sessions.filter(s => parse(s.date) >= ws).length;
  $("#top").innerHTML = `
    <div class="top-row"><h1>Training Log</h1><span class="date">${weekCount} session${weekCount === 1 ? "" : "s"} this week</span></div>
    <div class="week">${days.map(d => {
      const ds = iso(d);
      const ss = S.sessions.filter(s => s.date === ds);
      return `<div class="wd ${ds === t ? "today" : ""}">${d.toLocaleDateString("en-GB", {weekday: "narrow"})}<div class="dots">${ss.slice(0,3).map(s => `<span class="dot c-${typeColor(s)}"></span>`).join("")}</div></div>`;
    }).join("")}</div>`;
}

/* ---------- render: train ---------- */
function renderTrain(){
  if (!UI.mode) UI.mode = S.lastMode || S.order[0];
  const chips = [...S.order.map(k => ({k, name: S.templates[k].name, color: S.templates[k].color})), {k: "run", name: "Run", color: "green"}, {k: "class", name: "Class", color: "grey"}];
  let html = `<div class="stack"><div class="chips" role="group" aria-label="Session type">${chips.map(c =>
    `<button class="chip" data-act="mode" data-k="${c.k}" aria-pressed="${UI.mode === c.k}"><span class="sw c-${c.color}"></span>${esc(c.name)}</button>`).join("")}</div>`;
  if (S.templates[UI.mode]) html += liftView(UI.mode);
  else if (UI.mode === "run") html += runView();
  else html += classView();
  html += `</div>`;
  $("#view").innerHTML = html;
}

function liftView(day){
  const t = S.templates[day];
  const d = getDraft(day);
  const done = d.entries.filter(e => e.sets.some(s => s.done)).length;
  const anyDone = done > 0;
  const cards = d.entries.map((e, i) => {
    const x = exFor(t, e);
    const sg = suggest(x);
    const complete = e.sets.every(s => s.done);
    const tags = [x.tempOnly ? "Today only" : "", x.assisted ? "Assisted" : sideLabel(x.side)].filter(Boolean);
    return `<section class="ex ${complete ? "complete" : ""}">
      <div class="ex-head"><h3>${esc(e.name)}</h3><div class="ex-tools">${tags.map(g => `<span class="tag">${g}</span>`).join("")}<button class="rm" data-act="ex-rm" data-i="${i}" data-confirm="Remove?" aria-label="Remove ${esc(e.name)}">Remove</button></div></div>
      <p class="hint">${(e.reps || x.reps) ? `Target <b>${esc(e.reps || x.reps)}</b> reps · ` : ""}${sg.text}</p>
      <div class="sets">${e.sets.map((s, j) => `
        <div class="set">
          <span class="sn">${j + 1}</span>
          <label class="field"><input inputmode="decimal" data-in="w" data-i="${i}" data-j="${j}" value="${esc(s.w)}" aria-label="Set ${j + 1} weight"><span>kg</span></label>
          <label class="field"><input inputmode="numeric" data-in="r" data-i="${i}" data-j="${j}" value="${esc(s.r)}" placeholder="${repTop(e.reps || x.reps) || 12}" aria-label="Set ${j + 1} reps"><span>reps</span></label>
          <button class="tick" data-act="tick" data-i="${i}" data-j="${j}" aria-pressed="${s.done}" aria-label="Mark set ${j + 1} done">✓</button>
        </div>`).join("")}</div>
    </section>`;
  }).join("");
  return `
    <div class="session-head"><h2>${esc(t.name)}</h2><span class="muted small">${done} of ${d.entries.length} exercises started</span></div>
    <div class="panel form"><label class="small">Date<input type="date" id="lift-date" data-in="date" value="${d.date}"></label>
      <p class="small muted" style="margin:0">Warm up with 5 min on the bike or rower, then 2 lighter sets of your first exercise (about 50% for 10, then 75% for 5).</p></div>
    ${cards || `<div class="empty">No exercises in ${esc(t.name)} yet. Add one below.</div>`}
    <div class="panel form">
      <span class="label">Add an exercise</span>
      <input type="text" id="add-name" placeholder="e.g. Incline dumbbell press" aria-label="Exercise name">
      <div class="row">
        <label class="small">Starting kg<input type="number" inputmode="decimal" id="add-kg" placeholder="10"></label>
        <label class="small">Sets<input type="number" inputmode="numeric" id="add-sets" value="3"></label>
        <label class="small">Reps<input type="text" id="add-reps" placeholder="8-12"></label>
      </div>
      <div class="row">
        <label class="small">Sides<select id="add-side"><option value="">Both together</option><option value="each">Each side (R then L)</option><option value="per">Weight per side</option></select></label>
      </div>
      <label class="check small"><input type="checkbox" id="add-keep" checked> Keep it in ${esc(t.name)} for next time</label>
      <button class="btn ghost" data-act="ex-add-live">Add exercise</button>
    </div>
    <button class="btn" data-act="finish" ${anyDone ? "" : "disabled"}>Finish and save session</button>
    <button class="btn danger" data-act="discard" data-confirm="Tap again to discard">Discard this session</button>`;
}

/* ---------- render: history ---------- */
function renderHistory(){
  const ss = sortedSessions();
  if (!ss.length){ $("#view").innerHTML = `<div class="empty"><h2>No sessions yet</h2><p>Finish a workout on the Train tab and it shows up here, with your weights over time.</p></div>`; return; }
  // weekly counts, last 8 weeks
  const ws = weekStart(new Date());
  const weeks = [];
  for (let i = 7; i >= 0; i--){ const s = new Date(ws); s.setDate(ws.getDate() - i * 7); const e = new Date(s); e.setDate(s.getDate() + 7); weeks.push({s, n: S.sessions.filter(x => { const d = parse(x.date); return d >= s && d < e; }).length}); }
  const maxN = Math.max(6, ...weeks.map(w => w.n));
  // progress per exercise
  const prog = new Map();
  [...ss].reverse().forEach(s => { if (s.type !== "lift") return; s.entries.forEach(e => {
    const top = Math.max(...e.sets.map(x => Number(x.w) || 0));
    const k = norm(e.name);
    if (!prog.has(k)) prog.set(k, {name: e.name, first: top, last: top, n: 0, assisted: assistedByName(e.name)});
    const p = prog.get(k); p.last = top; p.n++;
  }); });
  const progHtml = [...prog.values()].filter(p => p.first || p.last).map(p => {
    const d = Math.round((p.last - p.first) * 100) / 100;
    const better = p.assisted ? d < 0 : d > 0;
    return `<div class="p"><span>${esc(p.name)}</span><b>${kg(p.first)} → ${kg(p.last)}kg ${d ? `<span class="${better ? "delta-up" : "muted"}">(${d > 0 ? "+" : ""}${kg(d)})</span>` : ""}</b></div>`;
  }).join("");
  $("#view").innerHTML = `<div class="stack">
    <div class="panel"><span class="label">Sessions per week</span>
      <div class="weeks" style="margin-top:10px">${weeks.map(w => `<div class="w"><span>${w.n || ""}</span><i style="height:${w.n / maxN * 44}px"></i><span>${w.s.getDate()}/${w.s.getMonth() + 1}</span></div>`).join("")}</div>
    </div>
    ${progHtml ? `<div class="panel prog"><span class="label">Weight progress, first to latest</span>${progHtml}</div>` : ""}
    <span class="label">All sessions</span>
    ${ss.map(s => `<details>
      <summary><span class="sw c-${typeColor(s)}"></span><span class="s-main"><span class="s-title">${esc(typeName(s))}</span><br><span class="small muted">${fmtDate(s.date)}${s.type === "lift" ? ` · ${s.entries.length} exercises` : s.type === "run" ? ` · ${kg(s.runMins)} min run` : ` · ${kg(s.mins)} min`}</span></span></summary>
      <div class="d-body">${detailBody(s)}
        <button class="btn danger small" data-act="del" data-id="${s.id}" data-confirm="Tap again to delete">Delete session</button></div>
    </details>`).join("")}
  </div>`;
}
function assistedByName(name){ for (const k in S.templates){ const x = S.templates[k].exercises.find(x => norm(x.name) === norm(name)); if (x) return !!x.assisted; } return false; }
function detailBody(s){
  if (s.type === "lift") return s.entries.map(e => `<div class="d-line"><span>${esc(e.name)}</span><span>${e.sets.map(x => `${kg(x.w)}×${x.r}`).join(", ")}</span></div>`).join("");
  if (s.type === "run") return `<div class="d-line"><span>${esc(typeName(s))}</span><span>${runLine(s)}</span></div>${s.notes ? `<div class="muted">${esc(s.notes)}</div>` : ""}`;
  return `<div class="d-line"><span>${esc(s.name)}</span><span>${kg(s.mins)} min</span></div>${s.notes ? `<div class="muted">${esc(s.notes)}</div>` : ""}`;
}

/* ---------- render: body ---------- */
const METRICS = [
  {k: "weight", label: "Weight (7-day avg)", unit: "kg", down: true},
  {k: "waist", label: "Waist at navel", unit: "cm", down: true},
  {k: "bf", label: "Body fat (InBody)", unit: "%", down: true},
  {k: "smm", label: "Muscle mass (InBody)", unit: "kg", down: false}
];
function renderBody(){
  const cs = [...S.checkins].sort((a, b) => b.date.localeCompare(a.date));
  const deltas = METRICS.map(m => {
    const has = cs.filter(c => c[m.k] != null);
    if (has.length < 2) return "";
    const first = has[has.length - 1][m.k], last = has[0][m.k];

    const good = m.down ? d < 0 : d > 0;
    return `<div class="p"><span>${m.label}</span><b>${kg(first)} → ${kg(last)}${m.unit} ${d ? `<span class="${good ? "delta-up" : "muted"}">(${d > 0 ? "+" : ""}${kg(d)})</span>` : ""}</b></div>`;
  }).join("");
  const line = (l, v, u) => v == null || v === "" ? "" : `<div class="d-line"><span>${l}</span><span>${esc(kg(v))}${u}</span></div>`;
  $("#view").innerHTML = `<div class="stack">
    <div class="session-head"><h2>Body</h2><span class="muted small">Sunday check-ins and InBody scans</span></div>

        <label class="small">Drinks this week<input type="number" inputmode="numeric" id="ck-drinks" placeholder="0"></label>
      </div>
      <span class="label">InBody scan (if you did one)</span>
      <div class="row">
        <label class="small">Body fat %<input type="number" inputmode="decimal" id="ck-bf" placeholder="20"></label>
        <label class="small">Muscle mass kg<input type="number" inputmode="decimal" id="ck-smm" placeholder="33"></label>
      </div>
      <p class="small muted" style="margin:0">Scan first thing in the morning, fasted, before training, with no alcohol in the last 48 hours.</p>
      <label class="small">Notes<input type="text" id="ck-notes" placeholder="e.g. Started creatine, trial scan"></label>
      <button class="btn" data-act="log-check">Save check-in</button>
    </div>
    ${cs.length ? `<span class="label">All check-ins</span>` : ""}
    ${cs.map(c => `<details>
      <summary><span class="sw c-${c.bf != null ? "accent" : "grey"}"></span><span class="s-main"><span class="s-title">${fmtDate(c.date)}${c.bf != null ? " · InBody" : ""}</span><br><span class="small muted">${[c.weight != null ? kg(c.weight) + "kg" : "", c.waist != null ? kg(c.waist) + "cm waist" : "", c.bf != null ? kg(c.bf) + "% fat" : ""].filter(Boolean).join(" · ") || "Check-in"}</span></span></summary>
      <div class="d-body">
        ${line("Weight, 7-day avg", c.weight, "kg")}${line("Waist", c.waist, "cm")}${line("Avg steps", c.steps, "")}${line("Drinks", c.drinks, "")}${line("Body fat", c.bf, "%")}${line("Muscle mass", c.smm, "kg")}
        ${c.notes ? `<div class="muted">${esc(c.notes)}</div>` : ""}
        <button class="btn danger small" data-act="del-check" data-id="${c.id}" data-confirm="Tap again to delete">Delete check-in</button>
      </div>

/* ---------- render ---------- */
function render(){
  renderTop();
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === UI.tab ? "page" : "false"));
  if (UI.tab === "train") renderTrain();
  else if (UI.tab === "history") renderHistory();
  else if (UI.tab === "body") renderBody();
  else renderSetup();
}

/* ---------- events ---------- */
function armed(btn){
  if (!btn.dataset.confirm) return true;
  if (btn.dataset.armed){ return true; }
  btn.dataset.armed = "1"; btn.dataset.orig = btn.textContent; btn.textContent = btn.dataset.confirm;
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = btn.dataset.orig; } }, 3000);
  return false;
}

document.addEventListener("click", e => {
  const tab = e.target.closest("nav button");
  if (tab){ UI.tab = tab.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (!armed(b)) return;
  const i = Number(b.dataset.i), j = Number(b.dataset.j);
  switch (act){
    case "mode": UI.mode = b.dataset.k; S.lastMode = UI.mode; save(); renderTrain(); break;
    case "tick": {
      const en = getDraft(UI.mode).entries[i], s = en.sets[j];
      s.done = !s.done;
      if (s.done && s.r === "") s.r = repTop(en.reps || exFor(S.templates[UI.mode], en).reps) || "12";
      if (s.done && s.w === "" && j > 0) s.w = getDraft(UI.mode).entries[i].sets[j - 1].w;
      save(); renderTrain(); break;
    }
    case "finish": {
      const day = UI.mode, d = getDraft(day);
      const entries = d.entries.map(e => ({name: e.name, sets: e.sets.filter(s => s.done).map(s => ({w: Number(s.w) || 0, r: Number(s.r) || 0}))})).filter(e => e.sets.length);
      if (!entries.length) return;
      S.sessions.push({id: uid(), type: "lift", day, label: S.templates[day].name, color: S.templates[day].color, date: d.date || today(), at: new Date().toISOString(), entries});
      delete S.drafts[day]; save(true);
      render(); window.scrollTo(0, 0);
      toast(`${S.templates[day].name} saved`);
      break;
    }
    case "discard": delete S.drafts[UI.mode]; save(true); renderTrain(); toast("Session discarded"); break;
    case "ex-add-live": {
      const day = UI.mode, t = S.templates[day], d = getDraft(day);
      const name = $("#add-name").value.trim();
      if (!name){ toast("Add the exercise name"); return; }
      const start = num($("#add-kg").value), side = $("#add-side").value;
      const sets = Math.max(1, Math.min(6, Number($("#add-sets").value) || 3)), reps = $("#add-reps").value.trim();
      if ($("#add-keep").checked){
        const x = ex(name, sets, reps, {start, side}); t.exercises.push(x); d.entries.push(entryFor(x));
        toast(`Added to ${t.name}`);
      } else {
        const x = {name, start, inc: 2.5, side, assisted: false, sets, reps};
        d.entries.push(entryFor(x, {exId: null, start, side, inc: 2.5}));
        toast("Added for today");
      }
      save(true); renderTrain(); break;
    }
    case "ex-rm": {
      const day = UI.mode, t = S.templates[day], d = getDraft(day);
      const [e] = d.entries.splice(i, 1);
      const k = e.exId ? t.exercises.findIndex(x => x.id === e.exId) : -1;
      if (k >= 0){ t.exercises.splice(k, 1); toast(`Removed from ${t.name}`); } else toast("Removed from today");
      save(true); renderTrain(); break;
    }
    case "log-run": {
      const mins = Number($("#run-mins").value), speed = Number($("#run-speed").value);
      if (!mins || !speed){ toast("Add how long you ran and how fast"); return; }
      const kind = $("#run-kind").value;
      S.sessions.push({id: uid(), type: "run", kind, date: $("#run-date").value || today(), at: new Date().toISOString(), runMins: mins, speed, rounds: num($("#run-rounds").value), incline: num($("#run-incline").value), notes: $("#run-notes").value.trim()});
      save(true);
      render(); toast(`${RUN_KINDS[kind]} saved`); break;
    }
    case "log-check": {
      const c = {id: uid(), date: $("#ck-date").value || today()};
      ["weight", "waist", "steps", "drinks", "bf", "smm"].forEach(k => { c[k] = num($("#ck-" + k).value); });
      c.notes = $("#ck-notes").value.trim();
      if (["weight", "waist", "steps", "drinks", "bf", "smm"].every(k => c[k] == null) && !c.notes){ toast("Add at least one number"); return; }
      S.checkins.push(c); save(true); render(); toast("Check-in saved"); break;
    }
    case "del-check": S.checkins = S.checkins.filter(c => c.id !== b.dataset.id); save(true); render(); toast("Check-in deleted"); break;
    case "log-class": {
      const name = $("#cl-name").value.trim();
      if (!name){ toast("Add the class name"); return; }
      S.sessions.push({id: uid(), type: "class", name, mins: Number($("#cl-mins").value) || 0, date: $("#cl-date").value || today(), at: new Date().toISOString(), notes: $("#cl-notes").value.trim()});
      save(true); render(); toast(`${name} saved`); break;
    }
    case "del": S.sessions = S.sessions.filter(s => s.id !== b.dataset.id); save(true); render(); toast("Session deleted"); break;
    case "ex-add": { const x = ex("New exercise", 3, "8-12"); S.templates[b.dataset.day].exercises.push(x); S.drafts[b.dataset.day]?.entries.push(entryFor(x)); } save(true); renderSetup(); openDay(b.dataset.day); break;
    case "ex-del": { const [x] = S.templates[b.dataset.day].exercises.splice(i, 1); const dr = S.drafts[b.dataset.day]; if (dr) dr.entries = dr.entries.filter(e => e.exId !== x.id); } save(true); renderSetup(); openDay(b.dataset.day); break;
    case "export": {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type: "application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `training-log-${today()}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      break;
    }
    case "copy": {
      const txt = JSON.stringify(S);
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast("Backup copied"), () => { const t = $("#imp-text"); t.value = txt; t.select(); toast("Selected. Copy it from the box."); });
      break;
    }
    case "import-text": importData($("#imp-text").value); break;
    case "reset": localStorage.removeItem(KEY); load(); UI.mode = null; render(); toast("All data erased"); break;
  }
});

function openDay(k){ const i = S.order.indexOf(k); const el = document.querySelectorAll("#view details")[i]; if (el) el.open = true; }

document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.in){
    const d = getDraft(UI.mode);
    if (el.dataset.in === "date"){ d.date = el.value; d.dateSet = true; }
    else d.entries[+el.dataset.i].sets[+el.dataset.j][el.dataset.in] = el.value.replace(",", ".");
    save(); return;
  }
  if (el.dataset.ed){
    const x = S.templates[el.dataset.day].exercises[+el.dataset.i];
    const f = el.dataset.ed;
    if (f === "assisted") x.assisted = el.checked;
    else if (f === "name" || f === "side" || f === "reps") x[f] = el.value;
    else if (f === "start") x.start = num(el.value);
    else if (f === "sets") x.sets = Math.max(1, Math.min(6, Number(el.value) || 3));
    else x[f] = Number(el.value) || 0;
    if (f === "name"){ const dr = S.drafts[el.dataset.day]; const en = dr?.entries.find(en => en.exId === x.id); if (en) en.name = x.name; }
    save(); return;
  }
});
document.addEventListener("change", e => {
  if (e.target.matches("select[data-ed], input[type=checkbox][data-ed]")) e.target.dispatchEvent(new Event("input", {bubbles: true}));
  if (e.target.id === "imp-file" && e.target.files[0]){ const r = new FileReader(); r.onload = () => importData(r.result); r.readAsText(e.target.files[0]); }
});

function importData(txt){
  try{
    const d = JSON.parse(txt);
    if (!d || !d.templates || !Array.isArray(d.sessions)) throw 0;
    S = d; migrate(); save(true); UI.mode = null; render(); toast(`Imported ${S.sessions.length} sessions`);
  } catch(err){ toast("That doesn't look like a Training Log backup"); }
}

// Home-screen apps can sit in the background for days; refresh dates when it comes back, unless you're mid-typing.
let lastDay = today();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || today() === lastDay) return;
  lastDay = today();
  const a = document.activeElement;
  if (!(a && a.matches("input, textarea, select"))) render();
});

load();
render();
})();
</script>
</body>
</html>
